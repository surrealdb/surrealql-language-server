# `xtask` is a build-time code generator, not a dependency of the server. It
# lives in its own package so `syn` never enters the library's dependency
# graph — that graph is shared with the wasm32 target and the published crate.
# With a root package present, `cargo build`/`cargo test`/`cargo clippy` still
# act on this package alone; `cargo xtask` reaches the generator through the
# alias in `.cargo/config.toml`.
[workspace]
members = ['xtask']

[package]
name = 'surrealql-language-server'
version = '0.6.0'
edition = '2024'
authors = ['Chiru Boggavarapu <chiru@foretag.co>', 'Tobie Morgan Hitchcock <tobie@surrealdb.com>']
license-file = 'LICENSE'
description = 'Language Server Protocol implementation for SurrealQL'
keywords = ['surrealdb', 'language-server']
categories = ['development-tools', 'parser-implementations']
repository = 'https://github.com/surrealdb/surrealql-language-server'
readme = 'README.md'
documentation = 'https://docs.rs/surrealql-language-server'

# The published crate carries the vendored grammar (about 0.3 MB compressed)
# because `build.rs` has nowhere else to look once it is unpacked. Everything
# below is repository furniture that a consumer never compiles.
exclude = [
    '.github/**',
    # Everything under docs/ is repository furniture, so the default is to keep
    # it out and name the exception. Listing the files to drop one by one meant
    # a doc added later shipped in the crate by default, which is the opposite
    # of what this list is for.
    #
    # `docs/diagnostics.md` is the exception: `check.rs` compiles it in with
    # `include_str!`, so a published crate without it does not build. The CI
    # step that packages the crate and builds it in isolation is what caught
    # that, and is why it exists.
    'docs/**',
    '!docs/diagnostics.md',
    'scripts/**',
    'tests/**',
    'xtask/**',
    'pkg/**',
    'wasm/**',
    'CHANGELOG.md',
]

# `cdylib` is required so `scripts/build-wasm.sh` can produce the
# browser-loadable wasm module; `rlib` keeps `cargo build`/`cargo test`
# behaviour identical to the previous lib layout.
[lib]
crate-type = ['cdylib', 'rlib']

# Dependencies shared by both the native binary and the WASM module. Keep
# this list strictly target-agnostic — anything that pulls in tokio,
# tower-lsp-server, surrealdb, or filesystem walkers belongs in one of
# the target-conditional sections below.
[dependencies]
async-trait = '0.1'
ls-types = '0.0.6'
serde = { version = '1.0', features = ['derive'] }
serde_json = '1.0'
strsim = '0.11.1'
tree-sitter = '0.26.6'

# Native (binary + library) dependencies. Pulls in the multi-threaded
# tokio runtime, the tower-lsp-server stdio framework, the SurrealDB
# Rust SDK for live metadata, and walkdir for workspace ingestion.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
surrealdb = { version = '3.0.5', default-features = false, features = ['protocol-http', 'protocol-ws', 'rustls'] }
tokio = { version = '1.48.0', features = ['io-std', 'macros', 'rt-multi-thread', 'sync', 'time'] }
tower-lsp-server = '0.23.0'
walkdir = '2.5.0'

# Browser (wasm32-unknown-unknown) dependencies. tokio_with_wasm provides
# a drop-in subset of tokio (sync, time, task) backed by the JavaScript
# event loop, so all shared core code compiles unchanged. send_wrapper
# lets us satisfy the Send + Sync bounds of the portable traits with
# `js_sys::Function` callbacks (sound on wasm because there is only one
# thread).
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = '0.1'
js-sys = '0.3'
parking_lot = '0.12'
send_wrapper = '0.6'
serde-wasm-bindgen = '0.6'
tokio_with_wasm = { version = '0.9', features = ['macros', 'rt', 'sync', 'time'] }
wasm-bindgen = '=0.2.108'
wasm-bindgen-futures = '=0.4.58'

[build-dependencies]
cc = '1.2.56'

[dev-dependencies]
pretty_assertions = '1.4.1'

# Latency benchmarks for the per-edit operations. `harness = false` keeps this
# a plain `main`, so no benchmarking framework enters the dev-dependency graph
# — that graph is shared with the wasm32 target. The binary exits non-zero when
# a target in `docs/perf-plan.md` regresses, so CI can gate on `cargo bench`.
[[bench]]
name = 'latency'
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
# Kept deliberately: catch_unwind is inert under abort anyway, dropping
# abort grows the size-optimized wasm/native artifacts, and continuing
# after a panic risks serving from partially-mutated state. Crash
# visibility comes from the stderr panic hook in main.rs (native) and
# console_error_panic_hook (wasm); editors auto-restart crashed servers.
panic = 'abort'
# Speed, not size.
#
# This used to be `'z'`, which costs roughly 1.6x across the board: measured on
# the same benchmark harness and machine: `analyze_document` on a 3,200-line file
# 46.4 ms at 'z' against 28.7 ms at 3, `semantic_tokens_full` 10.3 against 6.6,
# `semantic_diagnostics` 0.228 against 0.144. A larger win than anything left in
# `docs/perf-plan.md`, for a one-line change.
#
# The default belongs to the common case, which is the native binary: `cargo
# build --release`, `cargo install`, and every platform artifact CI uploads. The
# one consumer that *does* want size is the browser module, and
# `scripts/build-wasm.sh` opts into it with
# `CARGO_PROFILE_RELEASE_OPT_LEVEL=z`: a wasm artifact is downloaded, so there
# every kilobyte is a real cost.
opt-level = 3
