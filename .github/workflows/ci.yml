name: CI

on:
    push:
        branches:
            - '**'
        tags:
            - 'v*'
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    rust:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            # `grammar.pin` is the single source of the grammar revision; the
            # setup script is its only reader. Repeating the SHA here is what
            # let it drift into six places with no consistency check.
            - name: Check out tree-sitter grammar
              run: bash scripts/setup-grammar.sh
            # `surrealdb.pin` is the single source of this revision. Both the
            # catalogue freshness check and the conformance sweep read it, and
            # they must read the same one: the catalogue and the corpus describe
            # one engine.
            - name: Check out SurrealDB
              run: bash scripts/setup-surrealdb.sh
            - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
              with:
                  toolchain: 1.94.0
                  components: rustfmt, clippy
            - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
              name: Cache Rust Artifacts
            - name: Check formatting
              run: cargo fmt --check
            - name: Lint
              run: cargo clippy --all-targets -- -D warnings
            - name: Run tests
              run: cargo test
            # The only test that reads SurrealDB's own corpus end to end. It was
            # `#[ignore]`d for a two-minute runtime that the LineIndex work cut
            # to about four seconds, and in that time it was the only thing that
            # would have caught a false positive on valid SurrealQL.
            - name: Run the conformance sweep
              run: cargo test --test conformance -- --ignored
            # `cargo test` acts on the root package alone, so the generator's own
            # tests need naming. They cover the engine-source parsers, which is
            # where a SurrealDB layout change shows up first.
            - name: Run generator tests
              run: cargo test -p xtask
            # `cargo install surrealql-language-server` panicked in build.rs for
            # the whole life of the crate, because a crates.io consumer has no
            # sibling grammar checkout. The vendored copy fixes that, and this
            # step is what stops it drifting: it must match the pin, and the
            # packaged crate must build with no sibling anything in sight.
            - name: Check the vendored grammar matches the pin
              run: |
                  bash scripts/vendor-grammar.sh
                  git diff --exit-code -- vendor/ || {
                      echo "::error::vendor/ is stale; run \`make vendor-grammar\` and commit the result."
                      exit 1
                  }
            - name: Verify the published crate builds standalone
              run: |
                  cargo package --no-verify
                  rm -rf /tmp/crate-check && mkdir -p /tmp/crate-check
                  version=$(cargo metadata --no-deps --format-version 1 |
                      python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "surrealql-language-server"))')
                  tar xzf "target/package/surrealql-language-server-${version}.crate" -C /tmp/crate-check
                  cd "/tmp/crate-check/surrealql-language-server-${version}"
                  cargo build --locked

    # The npm package is built only on a tag, so a native-only type reaching
    # src/core/ used to be invisible until release day. This job is the tripwire
    # for the "must compile on both surfaces" rule.
    wasm-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - name: Check out tree-sitter grammar
              run: bash scripts/setup-grammar.sh
            - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
              with:
                  toolchain: 1.94.0
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
              name: Cache Rust Artifacts
            - name: Check the browser target
              run: cargo check --target wasm32-unknown-unknown --no-default-features

    release:
        if: startsWith(github.ref, 'refs/tags/v')
        # A red test must never ship a binary, a crate or an npm package.
        needs: rust
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      artifact: surrealql-language-server
                      asset: surrealql-language-server-linux-amd64
                      bin_dir: target/x86_64-unknown-linux-gnu/release
                    - os: ubuntu-24.04-arm
                      target: aarch64-unknown-linux-gnu
                      artifact: surrealql-language-server
                      asset: surrealql-language-server-linux-arm64
                      bin_dir: target/aarch64-unknown-linux-gnu/release
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      artifact: surrealql-language-server
                      asset: surrealql-language-server-macos-arm64
                      bin_dir: target/aarch64-apple-darwin/release
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      artifact: surrealql-language-server.exe
                      asset: surrealql-language-server-windows-amd64.exe
                      bin_dir: target/x86_64-pc-windows-msvc/release
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            # `grammar.pin` is the single source of the grammar revision; the
            # setup script is its only reader. Repeating the SHA here is what
            # let it drift into six places with no consistency check.
            - name: Check out tree-sitter grammar
              run: bash scripts/setup-grammar.sh
            - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
              with:
                  toolchain: 1.94.0
                  targets: ${{ matrix.target }}
            - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
              name: Cache Rust Artifacts
            - name: Build
              run: cargo build --release --target ${{ matrix.target }}
            - name: Rename artifact
              shell: bash
              run: cp ${{ matrix.bin_dir }}/${{ matrix.artifact }} ${{ matrix.asset }}
            - name: Upload release asset
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
              with:
                  files: ${{ matrix.asset }}

    publish:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: release
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            # `grammar.pin` is the single source of the grammar revision; the
            # setup script is its only reader. Repeating the SHA here is what
            # let it drift into six places with no consistency check.
            - name: Check out tree-sitter grammar
              run: bash scripts/setup-grammar.sh
            - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
              with:
                  toolchain: 1.94.0
            - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
              name: Cache Rust Artifacts
            - name: Publish to crates.io
              run: cargo publish
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
                  TREE_SITTER_SURREALQL_DIR: ${{ github.workspace }}/../surrealql-tree-sitter

    wasm:
        if: startsWith(github.ref, 'refs/tags/v')
        # A red test must never ship a binary, a crate or an npm package.
        needs: rust
        permissions:
            contents: write
            id-token: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            # `grammar.pin` is the single source of the grammar revision; the
            # setup script is its only reader. Repeating the SHA here is what
            # let it drift into six places with no consistency check.
            - name: Check out tree-sitter grammar
              run: bash scripts/setup-grammar.sh
            - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
              with:
                  toolchain: 1.94.0
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
              name: Cache Rust Artifacts
            - name: Install wasm-bindgen-cli
              run: command -v wasm-bindgen && wasm-bindgen --version | grep -q 0.2.108 || cargo install -f wasm-bindgen-cli --version 0.2.108
            - name: Install wasm-opt
              run: command -v wasm-opt || cargo install wasm-opt
            - name: Build wasm package
              run: bash scripts/build-wasm.sh
            # Do not set registry-url here — it writes an .npmrc that forces
            # NODE_AUTH_TOKEN auth and breaks npm OIDC trusted publishing.
            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: '24'
            - name: Ensure npm supports OIDC trusted publishing
              run: npm install -g npm@latest && npm --version
            - name: Align npm package version with release tag
              working-directory: pkg
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  npm pkg set "version=${VERSION}"
            - name: Pack npm tarball
              working-directory: pkg
              run: npm pack
            - name: Dry run publish to npm
              working-directory: pkg
              run: npm publish --dry-run --access public
            - name: Publish to npm
              working-directory: pkg
              run: npm publish --access public
            - name: Upload to GitHub Release
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
              with:
                  files: pkg/*.tgz

    # builtins.json is committed and freshness-checked by the `rust` job on
    # every push, so this job only attaches the already-correct file to the
    # release — no toolchain, no sibling checkouts. It is deliberately not
    # part of the `release` matrix (four runners would race to upload one
    # file) and not folded into `wasm` (that leg has failed on npm before,
    # and the data artifact should not share its fate).
    builtins:
        if: startsWith(github.ref, 'refs/tags/v')
        # A red test must never ship a binary, a crate or an npm package.
        needs: rust
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - name: Upload builtins.json to the GitHub Release
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
              with:
                  files: builtins.json
